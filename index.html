<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室 · 登录 & 发送消息</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef5fa 0%, #d4e4f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    /* 主容器 */
    .app-container {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 2rem;
      box-shadow: 0 30px 50px -20px rgba(0, 20, 40, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 92vh;
    }

    /* 顶部状态栏 */
    .app-header {
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #c6dae8;
      background: #ffffffd0;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #0b2b44;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .app-header h1 span {
      background: #1e5b8a;
      color: white;
      font-size: 0.85rem;
      padding: 0.15rem 0.7rem;
      border-radius: 40px;
      font-weight: 500;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #e7f0f8;
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #1a4b6e;
      border: 1px solid #b8d2e5;
    }

    .user-badge .avatar {
      width: 28px;
      height: 28px;
      background: #1e5b8a;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #b33b3b;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 30px;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #ffe9e9;
    }

    /* 登录区域 */
    .login-section {
      padding: 2.5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-section.hidden {
      display: none;
    }

    .login-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0b2b44;
      margin-bottom: 0.3rem;
    }

    .login-sub {
      color: #5f84a0;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .login-form {
      width: 100%;
      max-width: 340px;
    }

    .form-group {
      margin-bottom: 1.2rem;
      width: 100%;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1b4b6c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
      border: 2px solid #cbdde9;
      border-radius: 14px;
      background: white;
      transition: all 0.2s;
      outline: none;
      color: #0a1e2b;
    }

    .input-field:focus {
      border-color: #1e5b8a;
      box-shadow: 0 0 0 4px rgba(30, 91, 138, 0.12);
    }

    .input-field::placeholder {
      color: #9bb7cc;
      font-weight: 300;
    }

    .btn-primary {
      width: 100%;
      background: #1e5b8a;
      border: none;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 16px -6px rgba(20, 70, 110, 0.3);
      margin-top: 0.5rem;
    }

    .btn-primary:hover {
      background: #144a72;
      transform: translateY(-1px);
      box-shadow: 0 12px 20px -8px rgba(20, 70, 110, 0.4);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    /* 消息区域 */
    .chat-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .chat-section.hidden {
      display: none;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      background: #f9fcff;
      min-height: 280px;
      max-height: 420px;
    }

    .msg {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .msg.self {
      align-items: flex-end;
    }

    .msg-meta {
      font-size: 0.7rem;
      color: #6d8ea8;
      margin-bottom: 0.3rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .msg.self .msg-meta {
      flex-direction: row-reverse;
    }

    .msg-user {
      font-weight: 600;
      color: #1b4b6c;
    }

    .msg.self .msg-user {
      color: #a0c8e8;
    }

    .msg-time {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    .msg-bubble {
      max-width: 80%;
      background: #ffffff;
      border-radius: 18px 18px 18px 4px;
      padding: 0.7rem 1.1rem;
      box-shadow: 0 4px 10px -4px rgba(0, 20, 40, 0.1);
      border: 1px solid #d6e5f0;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.self .msg-bubble {
      background: #1e5b8a;
      color: white;
      border: none;
      border-radius: 18px 18px 4px 18px;
    }

    .empty-tip {
      text-align: center;
      color: #8aaec8;
      padding: 2rem 0;
      font-style: italic;
    }

    /* 发送区域 */
    .chat-input-area {
      padding: 1rem 2rem 1.8rem;
      background: #ffffffd0;
      border-top: 1px solid #c6dae8;
    }

    .send-row {
      display: flex;
      gap: 0.75rem;
    }

    .send-row .input-field {
      flex: 1;
      padding: 0.85rem 1.2rem;
    }

    .btn-send {
      background: #1e5b8a;
      border: none;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 14px -6px rgba(20, 70, 110, 0.3);
      white-space: nowrap;
    }

    .btn-send:hover {
      background: #144a72;
      transform: translateY(-1px);
    }

    .btn-send:active {
      transform: translateY(1px);
    }

    /* 消息提示 */
    .message-box {
      margin: 0 0 1rem 0;
      padding: 0.7rem 1rem;
      border-radius: 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
    }

    .message-box.success {
      background: #e2f3e6;
      color: #0d5530;
      border-color: #b1dfc2;
    }

    .message-box.error {
      background: #ffe9e9;
      color: #b33b3b;
      border-color: #fbc2c2;
    }

    .message-box.info {
      background: #e7f0f8;
      color: #1a4b6e;
      border-color: #b8d2e5;
    }

    /* 底部信息 */
    .app-footer {
      padding: 0.6rem 2rem 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: #698ea8;
      border-top: 1px solid #e2eef6;
      background: #ffffffb0;
    }

    .app-footer code {
      background: #e7f0f8;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-family: monospace;
      font-size: 0.7rem;
    }

    /* 滚动条美化 */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: #e7f0f8;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #b0cde0;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #8fb0c8;
    }

    /* 响应式 */
    @media (max-width: 520px) {
      .app-header {
        padding: 1rem 1.2rem;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .app-header h1 {
        font-size: 1.2rem;
      }

      .login-section {
        padding: 2rem 1.2rem 1.5rem;
      }

      .chat-messages {
        padding: 1.2rem 1.2rem;
      }

      .chat-input-area {
        padding: 0.8rem 1.2rem 1.5rem;
      }

      .send-row {
        flex-wrap: wrap;
      }

      .btn-send {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ================= 顶部栏 ================= -->
  <div class="app-header">
    <h1>
      💬 聊天室
      <span>PHP + TXT</span>
    </h1>
    <div id="userArea" style="display: none;">
      <div class="user-badge">
        <div class="avatar" id="avatarLetter">U</div>
        <span id="currentUser">未登录</span>
        <button class="logout-btn" id="logoutBtn">退出</button>
      </div>
    </div>
  </div>

  <!-- ================= 登录区域 ================= -->
  <div class="login-section" id="loginSection">
    <div class="login-icon">🔐</div>
    <div class="login-title">登录聊天室</div>
    <div class="login-sub">输入账号密码验证身份，账号将作为聊天昵称</div>

    <div id="loginMessage"></div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="loginUsername">账号</label>
        <input type="text" id="loginUsername" class="input-field" placeholder="例如 admin 或 user" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" class="input-field" placeholder="········" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">
        <span>→</span> 登录
      </button>
    </form>

    <div style="margin-top: 1.5rem; font-size: 0.8rem; color: #698ea8; text-align: center;">
      🧪 演示账号：<code>admin</code> / <code>admin123</code> &nbsp;|&nbsp;
      <code>user</code> / <code>password123</code>
    </div>
  </div>

  <!-- ================= 聊天区域 ================= -->
  <div class="chat-section hidden" id="chatSection">

    <!-- 消息列表 -->
    <div class="chat-messages" id="chatMessages">
      <div class="empty-tip">✨ 加载消息中…</div>
    </div>

    <!-- 发送区域 -->
    <div class="chat-input-area">
      <div id="chatMessage"></div>

      <form id="sendForm">
        <div class="send-row">
          <input type="text" id="messageInput" class="input-field" placeholder="输入消息…" autocomplete="off" required>
          <button type="submit" class="btn-send">
            <span>➤</span> 发送
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 底部信息 ================= -->
  <div class="app-footer">
    📁 数据存储：<code>users.txt</code> · <code>chat.txt</code> &nbsp;|&nbsp;
    ⚡ 接口调用：登录验证 & 消息收发
  </div>

</div>

<script>
  // ============================================================
  //  配置：根据你的 PHP 接口文件位置调整
  //  假设 login.php 和 chat.php 与当前 HTML 在同一目录
  //  如果你的接口文件名称不同，请修改下面的路径
  // ============================================================
  const LOGIN_API = 'login.php';   // 登录接口（验证账号密码）
  const CHAT_API  = 'chat.php';    // 聊天接口（获取/发送消息）

  // ---------- 全局状态 ----------
  let currentUser = null;          // 当前登录账号
  let currentPassword = null;      // 当前登录密码（用于发送消息时验证）

  // ---------- DOM 元素 ----------
  const loginSection = document.getElementById('loginSection');
  const chatSection = document.getElementById('chatSection');
  const userArea = document.getElementById('userArea');
  const currentUserSpan = document.getElementById('currentUser');
  const avatarLetter = document.getElementById('avatarLetter');
  const loginForm = document.getElementById('loginForm');
  const sendForm = document.getElementById('sendForm');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const loginMessage = document.getElementById('loginMessage');
  const chatMessage = document.getElementById('chatMessage');
  const logoutBtn = document.getElementById('logoutBtn');

  // ============================================================
  //  1. 登录验证 —— 调用登录接口
  //     接口返回格式约定：JSON { success: true/false, message: "..." }
  // ============================================================
  async function verifyLogin(username, password) {
    // 使用 URLSearchParams 发送 POST 请求
    const params = new URLSearchParams();
    params.append('username', username);
    params.append('password', password);
    // 如果 login.php 需要 action 参数，可添加：params.append('action', 'login');

    try {
      const response = await fetch(LOGIN_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      // 尝试解析 JSON，若接口返回非 JSON 则捕获
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        // 如果接口返回的是纯文本或 HTML，根据文本内容判断
        // 这里做兼容：如果包含 "success" 或 "登录成功" 等关键词
        const isSuccess = text.includes('success') || text.includes('登录成功');
        data = {
          success: isSuccess,
          message: isSuccess ? '登录成功' : (text.substring(0, 100) || '登录失败')
        };
      }
      return data;
    } catch (error) {
      console.error('登录请求失败:', error);
      return { success: false, message: '网络错误，请检查接口路径：' + LOGIN_API };
    }
  }

  // ============================================================
  //  2. 获取聊天记录 —— 调用聊天接口（GET 或 POST）
  // ============================================================
  async function fetchMessages() {
    try {
      // 使用 GET 请求获取消息列表，接口返回 JSON 格式消息数组
      // 假设 chat.php?action=get 返回 [{time, user, content}, ...]
      const response = await fetch(CHAT_API + '?action=get');
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        // 兼容返回 HTML 的情况：提取纯文本或忽略
        console.warn('聊天接口返回非 JSON，尝试解析:', text.substring(0, 200));
        // 如果接口返回的是 HTML（如之前的示例），我们无法直接解析，
        // 此处返回空数组，并提示使用 JSON 接口
        return [];
      }
      return Array.isArray(data) ? data : [];
    } catch (error) {
      console.error('获取消息失败:', error);
      return [];
    }
  }

  // ============================================================
  //  3. 发送消息 —— 调用聊天接口（POST）
  // ============================================================
  async function sendMessage(username, password, content) {
    const params = new URLSearchParams();
    params.append('action', 'send');
    params.append('username', username);
    params.append('password', password);
    params.append('content', content);

    try {
      const response = await fetch(CHAT_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        // 兼容纯文本返回：根据内容判断是否成功
        const isSuccess = text.includes('success') || text.includes('发送成功') || response.ok;
        data = { success: isSuccess, message: isSuccess ? '发送成功' : '发送失败' };
      }
      return data;
    } catch (error) {
      console.error('发送消息失败:', error);
      return { success: false, message: '网络错误' };
    }
  }

  // ============================================================
  //  4. 渲染聊天记录
  // ============================================================
  function renderMessages(messages) {
    if (!messages || messages.length === 0) {
      chatMessages.innerHTML = '<div class="empty-tip">✨ 还没有消息，来说第一句吧～</div>';
      return;
    }

    let html = '';
    messages.forEach(msg => {
      // 兼容 msg.time 可能是字符串或数字
      const timeVal = msg.time || msg.timestamp || 0;
      const date = new Date(timeVal * 1000);
      const timeStr = isNaN(date.getTime()) ? '刚刚' : date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      const isSelf = currentUser && (msg.user === currentUser || msg.username === currentUser);
      const username = msg.user || msg.username || '匿名';
      const content = msg.content || msg.message || '';

      html += `
        <div class="msg ${isSelf ? 'self' : ''}">
          <div class="msg-meta">
            <span class="msg-user">${escapeHtml(username)}</span>
            <span class="msg-time">${timeStr}</span>
          </div>
          <div class="msg-bubble">
            ${nl2br(escapeHtml(content))}
          </div>
        </div>
      `;
    });

    chatMessages.innerHTML = html;
    // 滚动到底部
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // 辅助函数
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function nl2br(str) {
    return str.replace(/\n/g, '<br>');
  }

  // ============================================================
  //  5. UI 状态切换
  // ============================================================
  function showLogin() {
    loginSection.classList.remove('hidden');
    chatSection.classList.add('hidden');
    userArea.style.display = 'none';
    currentUser = null;
    currentPassword = null;
  }

  function showChat(username) {
    loginSection.classList.add('hidden');
    chatSection.classList.remove('hidden');
    userArea.style.display = 'block';
    currentUserSpan.textContent = username;
    avatarLetter.textContent = username.charAt(0).toUpperCase();
  }

  // ============================================================
  //  6. 登录表单提交
  // ============================================================
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!username || !password) {
      loginMessage.innerHTML = '<div class="message-box error">⚠️ 账号和密码不能为空</div>';
      return;
    }

    loginMessage.innerHTML = '<div class="message-box info">⏳ 验证中…</div>';

    // 调用登录接口验证
    const result = await verifyLogin(username, password);

    if (result.success) {
      // 登录成功
      currentUser = username;
      currentPassword = password;  // 保存密码用于发送消息

      loginMessage.innerHTML = '<div class="message-box success">✅ 登录成功，正在进入聊天室…</div>';

      // 延迟一下让用户看到提示
      setTimeout(async () => {
        showChat(username);
        loginMessage.innerHTML = '';
        // 加载聊天记录
        const messages = await fetchMessages();
        renderMessages(messages);
      }, 500);
    } else {
      loginMessage.innerHTML = `<div class="message-box error">❌ ${result.message || '账号或密码错误'}</div>`;
    }
  });

  // ============================================================
  //  7. 发送消息
  // ============================================================
  sendForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const content = messageInput.value.trim();
    if (!content) return;

    if (!currentUser || !currentPassword) {
      chatMessage.innerHTML = '<div class="message-box error">⚠️ 请先登录</div>';
      return;
    }

    // 禁用发送按钮防止重复提交
    const sendBtn = sendForm.querySelector('.btn-send');
    sendBtn.disabled = true;
    sendBtn.style.opacity = '0.6';

    chatMessage.innerHTML = '<div class="message-box info">⏳ 发送中…</div>';

    // 调用发送接口
    const result = await sendMessage(currentUser, currentPassword, content);

    if (result.success) {
      messageInput.value = '';
      chatMessage.innerHTML = ''; // 清除提示
      // 刷新消息列表
      const messages = await fetchMessages();
      renderMessages(messages);
    } else {
      chatMessage.innerHTML = `<div class="message-box error">❌ ${result.message || '发送失败'}</div>`;
    }

    // 恢复按钮
    sendBtn.disabled = false;
    sendBtn.style.opacity = '1';
    messageInput.focus();
  });

  // ============================================================
  //  8. 退出登录
  // ============================================================
  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    currentPassword = null;
    showLogin();
    // 清空输入框
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    loginMessage.innerHTML = '';
    chatMessages.innerHTML = '<div class="empty-tip">✨ 加载消息中…</div>';
  });

  // ============================================================
  //  9. 自动刷新消息（可选，每 8 秒刷新一次）
  // ============================================================
  let refreshInterval = null;

  function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(async () => {
      if (currentUser) {
        const messages = await fetchMessages();
        renderMessages(messages);
      }
    }, 8000); // 8秒刷新一次
  }

  // 页面加载时启动自动刷新
  window.addEventListener('load', () => {
    startAutoRefresh();
  });
