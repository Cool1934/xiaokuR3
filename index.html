<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室 · 登录 / 注册 / 发送消息</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef5fa 0%, #d4e4f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    /* 主容器 */
    .app-container {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 2rem;
      box-shadow: 0 30px 50px -20px rgba(0, 20, 40, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 92vh;
    }

    /* 顶部状态栏 */
    .app-header {
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #c6dae8;
      background: #ffffffd0;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #0b2b44;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .app-header h1 span {
      background: #1e5b8a;
      color: white;
      font-size: 0.85rem;
      padding: 0.15rem 0.7rem;
      border-radius: 40px;
      font-weight: 500;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #e7f0f8;
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #1a4b6e;
      border: 1px solid #b8d2e5;
    }

    .user-badge .avatar {
      width: 28px;
      height: 28px;
      background: #1e5b8a;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #b33b3b;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 30px;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #ffe9e9;
    }

    /* 登录/注册区域 */
    .auth-section {
      padding: 2.5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-section.hidden {
      display: none;
    }

    .auth-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0b2b44;
      margin-bottom: 0.3rem;
    }

    .auth-sub {
      color: #5f84a0;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* 切换标签（登录/注册） */
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      background: #e7f0f8;
      border-radius: 40px;
      padding: 0.3rem;
      margin-bottom: 1.8rem;
      width: 100%;
      max-width: 340px;
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem 1rem;
      border: none;
      background: transparent;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #4a7392;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: white;
      color: #1e5b8a;
      box-shadow: 0 4px 10px -4px rgba(0, 20, 40, 0.15);
      font-weight: 600;
    }

    .auth-form {
      width: 100%;
      max-width: 340px;
    }

    .form-group {
      margin-bottom: 1.2rem;
      width: 100%;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1b4b6c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
      border: 2px solid #cbdde9;
      border-radius: 14px;
      background: white;
      transition: all 0.2s;
      outline: none;
      color: #0a1e2b;
    }

    .input-field:focus {
      border-color: #1e5b8a;
      box-shadow: 0 0 0 4px rgba(30, 91, 138, 0.12);
    }

    .input-field::placeholder {
      color: #9bb7cc;
      font-weight: 300;
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
    }

    .btn-primary {
      background: #1e5b8a;
      color: white;
      box-shadow: 0 8px 16px -6px rgba(20, 70, 110, 0.3);
    }

    .btn-primary:hover {
      background: #144a72;
      transform: translateY(-1px);
      box-shadow: 0 12px 20px -8px rgba(20, 70, 110, 0.4);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #e7f0f8;
      color: #1e5b8a;
      border: 2px solid #c6dae8;
    }

    .btn-secondary:hover {
      background: #d8e8f4;
      transform: translateY(-1px);
    }

    .btn-secondary:active {
      transform: translateY(1px);
    }

    /* 消息区域 */
    .chat-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .chat-section.hidden {
      display: none;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      background: #f9fcff;
      min-height: 280px;
      max-height: 420px;
    }

    .msg {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .msg.self {
      align-items: flex-end;
    }

    .msg-meta {
      font-size: 0.7rem;
      color: #6d8ea8;
      margin-bottom: 0.3rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .msg.self .msg-meta {
      flex-direction: row-reverse;
    }

    .msg-user {
      font-weight: 600;
      color: #1b4b6c;
    }

    .msg.self .msg-user {
      color: #a0c8e8;
    }

    .msg-time {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    .msg-bubble {
      max-width: 80%;
      background: #ffffff;
      border-radius: 18px 18px 18px 4px;
      padding: 0.7rem 1.1rem;
      box-shadow: 0 4px 10px -4px rgba(0, 20, 40, 0.1);
      border: 1px solid #d6e5f0;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.self .msg-bubble {
      background: #1e5b8a;
      color: white;
      border: none;
      border-radius: 18px 18px 4px 18px;
    }

    .empty-tip {
      text-align: center;
      color: #8aaec8;
      padding: 2rem 0;
      font-style: italic;
    }

    /* 发送区域 */
    .chat-input-area {
      padding: 1rem 2rem 1.8rem;
      background: #ffffffd0;
      border-top: 1px solid #c6dae8;
    }

    .send-row {
      display: flex;
      gap: 0.75rem;
    }

    .send-row .input-field {
      flex: 1;
      padding: 0.85rem 1.2rem;
    }

    .btn-send {
      background: #1e5b8a;
      border: none;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 14px -6px rgba(20, 70, 110, 0.3);
      white-space: nowrap;
    }

    .btn-send:hover {
      background: #144a72;
      transform: translateY(-1px);
    }

    .btn-send:active {
      transform: translateY(1px);
    }

    /* 消息提示 */
    .message-box {
      margin: 0 0 1rem 0;
      padding: 0.7rem 1rem;
      border-radius: 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
    }

    .message-box.success {
      background: #e2f3e6;
      color: #0d5530;
      border-color: #b1dfc2;
    }

    .message-box.error {
      background: #ffe9e9;
      color: #b33b3b;
      border-color: #fbc2c2;
    }

    .message-box.info {
      background: #e7f0f8;
      color: #1a4b6e;
      border-color: #b8d2e5;
    }

    /* 底部信息 */
    .app-footer {
      padding: 0.6rem 2rem 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: #698ea8;
      border-top: 1px solid #e2eef6;
      background: #ffffffb0;
    }

    .app-footer code {
      background: #e7f0f8;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-family: monospace;
      font-size: 0.7rem;
    }

    /* 滚动条美化 */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: #e7f0f8;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #b0cde0;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #8fb0c8;
    }

    /* 响应式 */
    @media (max-width: 520px) {
      .app-header {
        padding: 1rem 1.2rem;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .app-header h1 {
        font-size: 1.2rem;
      }

      .auth-section {
        padding: 2rem 1.2rem 1.5rem;
      }

      .chat-messages {
        padding: 1.2rem 1.2rem;
      }

      .chat-input-area {
        padding: 0.8rem 1.2rem 1.5rem;
      }

      .send-row {
        flex-wrap: wrap;
      }

      .btn-send {
        width: 100%;
        justify-content: center;
      }

      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ================= 顶部栏 ================= -->
  <div class="app-header">
    <h1>
      💬 聊天室
      <span>PHP + TXT</span>
    </h1>
    <div id="userArea" style="display: none;">
      <div class="user-badge">
        <div class="avatar" id="avatarLetter">U</div>
        <span id="currentUser">未登录</span>
        <button class="logout-btn" id="logoutBtn">退出</button>
      </div>
    </div>
  </div>

  <!-- ================= 登录 / 注册 区域 ================= -->
  <div class="auth-section" id="authSection">
    <div class="auth-icon" id="authIcon">🔐</div>
    <div class="auth-title" id="authTitle">登录聊天室</div>
    <div class="auth-sub" id="authSub">输入账号密码验证身份，账号将作为聊天昵称</div>

    <!-- 切换标签 -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">登录</button>
      <button class="auth-tab" id="tabRegister" type="button">注册</button>
    </div>

    <div id="authMessage"></div>

    <form class="auth-form" id="authForm">
      <div class="form-group">
        <label for="authUsername">账号</label>
        <input type="text" id="authUsername" class="input-field" placeholder="例如 admin 或 user" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="authPassword">密码</label>
        <input type="password" id="authPassword" class="input-field" placeholder="········" autocomplete="current-password" required>
      </div>
      <div class="form-group" id="confirmGroup" style="display: none;">
        <label for="authConfirm">确认密码</label>
        <input type="password" id="authConfirm" class="input-field" placeholder="再次输入密码" autocomplete="new-password">
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-primary" id="authSubmitBtn">
          <span>→</span> 登录
        </button>
      </div>
    </form>

    <div style="margin-top: 1.5rem; font-size: 0.8rem; color: #698ea8; text-align: center;">
      🧪 演示账号：<code>admin</code> / <code>admin123</code> &nbsp;|&nbsp;
      <code>user</code> / <code>password123</code>
    </div>
  </div>

  <!-- ================= 聊天区域 ================= -->
  <div class="chat-section hidden" id="chatSection">

    <!-- 消息列表 -->
    <div class="chat-messages" id="chatMessages">
      <div class="empty-tip">✨ 加载消息中…</div>
    </div>

    <!-- 发送区域 -->
    <div class="chat-input-area">
      <div id="chatMessage"></div>

      <form id="sendForm">
        <div class="send-row">
          <input type="text" id="messageInput" class="input-field" placeholder="输入消息…" autocomplete="off" required>
          <button type="submit" class="btn-send">
            <span>➤</span> 发送
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 底部信息 ================= -->
  <div class="app-footer">
    📁 数据存储：<code>users.txt</code> · <code>chat.txt</code> &nbsp;|&nbsp;
    ⚡ 接口调用：登录 / 注册 / 消息收发
  </div>

</div>

<script>
  // ============================================================
  //  配置：根据你的 PHP 接口文件位置调整
  // ============================================================
  const LOGIN_API    = 'login.php';    // 登录接口
  const REGISTER_API = 'register.php'; // 注册接口（或与登录同一文件）
  const CHAT_API     = 'chat.php';     // 聊天接口

  // ---------- 全局状态 ----------
  let currentUser = null;
  let currentPassword = null;
  let currentMode = 'login'; // 'login' 或 'register'

  // ---------- DOM 元素 ----------
  const authSection = document.getElementById('authSection');
  const chatSection = document.getElementById('chatSection');
  const userArea = document.getElementById('userArea');
  const currentUserSpan = document.getElementById('currentUser');
  const avatarLetter = document.getElementById('avatarLetter');
  const authForm = document.getElementById('authForm');
  const sendForm = document.getElementById('sendForm');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const authMessage = document.getElementById('authMessage');
  const chatMessage = document.getElementById('chatMessage');
  const logoutBtn = document.getElementById('logoutBtn');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const authIcon = document.getElementById('authIcon');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const confirmGroup = document.getElementById('confirmGroup');
  const authConfirm = document.getElementById('authConfirm');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');

  // ============================================================
  //  1. 切换 登录 / 注册 模式
  // ============================================================
  function switchMode(mode) {
    currentMode = mode;
    authMessage.innerHTML = '';

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      authIcon.textContent = '🔐';
      authTitle.textContent = '登录聊天室';
      authSub.textContent = '输入账号密码验证身份，账号将作为聊天昵称';
      confirmGroup.style.display = 'none';
      authConfirm.required = false;
      authSubmitBtn.innerHTML = '<span>→</span> 登录';
      authPassword.setAttribute('autocomplete', 'current-password');
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      authIcon.textContent = '📝';
      authTitle.textContent = '注册新账号';
      authSub.textContent = '创建账号后即可登录聊天，账号将作为聊天昵称';
      confirmGroup.style.display = 'block';
      authConfirm.required = true;
      authSubmitBtn.innerHTML = '<span>✨</span> 注册';
      authPassword.setAttribute('autocomplete', 'new-password');
    }
  }

  tabLogin.addEventListener('click', () => switchMode('login'));
  tabRegister.addEventListener('click', () => switchMode('register'));

  // ============================================================
  //  2. 登录验证
  // ============================================================
  async function verifyLogin(username, password) {
    const params = new URLSearchParams();
    params.append('username', username);
    params.append('password', password);

    try {
      const response = await fetch(LOGIN_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        const isSuccess = text.includes('success') || text.includes('登录成功');
        data = {
          success: isSuccess,
          message: isSuccess ? '登录成功' : (text.substring(0, 100) || '登录失败')
        };
      }
      return data;
    } catch (error) {
      console.error('登录请求失败:', error);
      return { success: false, message: '网络错误，请检查接口路径：' + LOGIN_API };
    }
  }

  // ============================================================
  //  3. 注册账号
  // ============================================================
  async function registerUser(username, password) {
    const params = new URLSearchParams();
    params.append('username', username);
    params.append('password', password);
    // 如果注册接口与登录接口是同一个文件，可以加 action 参数
    params.append('action', 'register');

    try {
      const response = await fetch(REGISTER_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        const isSuccess = text.includes('success') || text.includes('注册成功');
        data = {
          success: isSuccess,
          message: isSuccess ? '注册成功' : (text.substring(0, 100) || '注册失败')
        };
      }
      return data;
    } catch (error) {
      console.error('注册请求失败:', error);
      return { success: false, message: '网络错误，请检查接口路径：' + REGISTER_API };
    }
  }

  // ============================================================
  //  4. 获取聊天记录
  // ============================================================
  async function fetchMessages() {
    try {
      const response = await fetch(CHAT_API + '?action=get');
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        console.warn('聊天接口返回非 JSON:', text.substring(0, 200));
        return [];
      }
      return Array.isArray(data) ? data : [];
    } catch (error) {
      console.error('获取消息失败:', error);
      return [];
    }
  }

  // ============================================================
  //  5. 发送消息
  // ============================================================
  async function sendMessage(username, password, content) {
    const params = new URLSearchParams();
    params.append('action', 'send');
    params.append('username', username);
    params.append('password', password);
    params.append('content', content);

    try {
      const response = await fetch(CHAT_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        const isSuccess = text.includes('success') || text.includes('发送成功') || response.ok;
        data = { success: isSuccess, message: isSuccess ? '发送成功' : '发送失败' };
      }
      return data;
    } catch (error) {
      console.error('发送消息失败:', error);
      return { success: false, message: '网络错误' };
    }
  }

  // ============================================================
  //  6. 渲染聊天记录
  // ============================================================
  function renderMessages(messages) {
    if (!messages || messages.length === 0) {
      chatMessages.innerHTML = '<div class="empty-tip">✨ 还没有消息，来说第一句吧～</div>';
      return;
    }

    let html = '';
    messages.forEach(msg => {
      const timeVal = msg.time || msg.timestamp || 0;
      const date = new Date(timeVal * 1000);
      const timeStr = isNaN(date.getTime()) ? '刚刚' : date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      const isSelf = currentUser && (msg.user === currentUser || msg.username === currentUser);
      const username = msg.user || msg.username || '匿名';
      const content = msg.content || msg.message || '';

      html += `
        <div class="msg ${isSelf ? 'self' : ''}">
          <div class="msg-meta">
            <span class="msg-user">${escapeHtml(username)}</span>
            <span class="msg-time">${timeStr}</span>
          </div>
          <div class="msg-bubble">
            ${nl2br(escapeHtml(content))}
          </div>
        </div>
      `;
    });

    chatMessages.innerHTML = html;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function nl2br(str) {
    return str.replace(/\n/g, '<br>');
  }

  // ============================================================
  //  7. UI 状态切换
  // ============================================================
  function showAuth() {
    authSection.classList.remove('hidden');
    chatSection.classList.add('hidden');
    userArea.style.display = 'none';
    currentUser = null;
    currentPassword = null;
  }

  function showChat(username) {
    authSection.classList.add('hidden');
    chatSection.classList.remove('hidden');
    userArea.style.display = 'block';
    currentUserSpan.textContent = username;
    avatarLetter.textContent = username.charAt(0).toUpperCase();
  }

  // ============================================================
  //  8. 表单提交（登录 或 注册）
  // ============================================================
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = authUsername.value.trim();
    const password = authPassword.value.trim();
    const confirm = authConfirm.value.trim();

    if (!username || !password) {
      authMessage.innerHTML = '<div class="message-box error">⚠️ 账号和密码不能为空</div>';
      return;
    }

    // 注册模式下检查确认密码
    if (currentMode === 'register') {
      if (!confirm) {
        authMessage.innerHTML = '<div class="message-box error">⚠️ 请确认密码</div>';
        return;
      }
      if (password !== confirm) {
        authMessage.innerHTML = '<div class="message-box error">⚠️ 两次输入的密码不一致</div>';
        return;
      }
    }

    // 禁用提交按钮
    authSubmitBtn.disabled = true;
    authSubmitBtn.style.opacity = '0.6';

    if (currentMode === 'login') {
      // ---------- 登录 ----------
      authMessage.innerHTML = '<div class="message-box info">⏳ 验证中…</div>';
      const result = await verifyLogin(username, password);

      if (result.success) {
        currentUser = username;
        currentPassword = password;

        authMessage.innerHTML = '<div class="message-box success">✅ 登录成功，正在进入聊天室…</div>';

        setTimeout(async () => {
          showChat(username);
          authMessage.innerHTML = '';
          const messages = await fetchMessages();
          renderMessages(messages);
        }, 500);
      } else {
        authMessage.innerHTML = `<div class="message-box error">❌ ${result.message || '账号或密码错误'}</div>`;
      }
    } else {
      // ---------- 注册 ----------
      authMessage.innerHTML = '<div class="message-box info">⏳ 注册中…</div>';
      const result = await registerUser(username, password);

      if (result.success) {
        authMessage.innerHTML = '<div class="message-box success">✅ 注册成功！正在自动登录…</div>';

        // 注册成功后自动登录
        const loginResult = await verifyLogin(username, password);
        if (loginResult.success) {
          currentUser = username;
          currentPassword = password;
          setTimeout(async () => {
            showChat(username);
            authMessage.innerHTML = '';
            const messages = await fetchMessages();
            renderMessages(messages);
          }, 600);
        } else {
          // 注册成功但登录失败（理论上不会），切换到登录模式
          authMessage.innerHTML = '<div class="message-box success">✅ 注册成功，请手动登录</div>';
          switchMode('login');
          authPassword.value = '';
          authConfirm.value = '';
        }
      } else {
        authMessage.innerHTML = `<div class="message-box error">❌ ${result.message || '注册失败，账号可能已存在'}</div>`;
      }
    }

    // 恢复提交按钮
    authSubmitBtn.disabled = false;
    authSubmitBtn.style.opacity = '1';
  });

  // ============================================================
  //  9. 发送消息
  // ============================================================
  sendForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const content = messageInput.value.trim();
    if (!content) return;

    if (!currentUser || !currentPassword) {
      chatMessage.innerHTML = '<div class="message-box error">⚠️ 请先登录</div>';
      return;
    }

    const sendBtn = sendForm.querySelector('.btn-send');
    sendBtn.disabled = true;
    sendBtn.style.opacity = '0.6';

    chatMessage.innerHTML = '<div class="message-box info">⏳ 发送中…</div>';

    const result = await sendMessage(currentUser, currentPassword, content);

    if (result.success) {
      messageInput.value = '';
      chatMessage.innerHTML = '';
      const messages = await fetchMessages();
      renderMessages(messages);
    } else {
      chatMessage.innerHTML = `<div class="message-box error">❌ ${result.message || '发送失败'}</div>`;
    }

    sendBtn.disabled = false;
    sendBtn.style.opacity = '1';
    messageInput.focus();
  });

  // ============================================================
  //  10. 退出登录
  // ============================================================
  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    currentPassword = null;
    showAuth();
    authUsername.value = '';
    authPassword.value = '';
    authConfirm.value = '';
    authMessage.innerHTML = '';
    chatMessages.innerHTML = '<div class="empty-tip">✨ 加载消息中…</div>';
    switchMode('login');
  });

  // ============================================================
  //  11. 自动刷新消息
  // ============================================================
  let refreshInterval = null;

  function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(async () => {
      if (currentUser) {
        const messages = await fetchMessages();
        renderMessages(messages);
      }
    }, 8000);
  }

  window.addEventListener('load', () => {
    startAutoRefresh();
    switchMode('login');
  });

</script>
</body>
</html>
  })();

</script>
</body>
</html>
